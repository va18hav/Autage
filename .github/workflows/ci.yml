name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend-tests:
    name: Backend (Python 3.13 + Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run test suite
        run: uv run pytest -v

  dashboard-check:
    name: Dashboard (TypeScript + Oxlint + Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with Oxlint
        run: npm run lint

      - name: Typecheck & build production bundle
        run: npm run build
