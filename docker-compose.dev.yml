# Optional local-development override.
# It exposes Postgres and Redis only on the host loopback interface so that
# host-run scripts can connect. The default Compose stack keeps them private.
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"
